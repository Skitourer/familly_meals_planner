# Versions : release-please lit les messages de commit (Conventional Commits),
# tient le CHANGELOG à jour et ouvre une PR de version ; sa fusion crée la release
# et publie l'image Docker étiquetée.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      cree: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Jeton temporaire (1 h) de la GitHub App de publication : la PR de version qu'elle
      # crée déclenche la CI, contrairement au jeton automatique GITHUB_TOKEN, et ses
      # commits sont signés par le robot de l'App. Variable RELEASE_APP_ID et secret
      # RELEASE_APP_PRIVATE_KEY : voir docs/contribuer.md.
      - id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Sans App configurée : repli sur GITHUB_TOKEN (fermer/rouvrir la PR pour lancer la CI).
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image-versionnee:
    needs: release-please
    if: needs.release-please.outputs.cree == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.version }}
