# Intégration continue : qualité, tests et construction de l'image à chaque PR et sur main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_MKDOCS_2_WARNING: "1"

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Dépendances
        run: uv sync --locked
      - name: Style (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types (pyright)
        run: uv run pyright
      - name: Tests et couverture (catalogue, algorithme, API)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Failles connues des dépendances (pip-audit)
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/exigences.txt"
          uvx pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/exigences.txt"

  frontend:
    name: Interface (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Failles connues des dépendances (npm audit)
        run: npm audit --audit-level=high
      - name: Style (prettier)
        run: npm run lint
      - name: Types (svelte-check)
        run: npm run check
      - name: Tests (vitest)
        run: npm test
      - name: Compilation
        run: npm run build

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tout l'historique : un secret supprimé reste dans les anciens commits
      - name: Installation de gitleaks
        run: >
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          | tar xz gitleaks
      - name: Recherche de secrets dans l'historique
        run: ./gitleaks git . --redact --no-banner --verbose

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Compilation stricte (liens cassés = erreur)
        run: uv run --project backend --only-group docs mkdocs build --strict -d site

  image:
    name: Image Docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
      # amd64 pour un VPS, arm64 pour un Raspberry Pi. Publiée seulement depuis main.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
