# =============================================================================
# Référentiel des ingrédients (fichier édité à la main)
# =============================================================================
#
# Chaque ingrédient utilisé par une recette doit être décrit ici. Les valeurs
# nutritionnelles, l'empreinte carbone, la saisonnalité, les conditionnements
# et les prix NE SONT PAS saisis ici : ils sont importés depuis les bases
# ouvertes par `uv run repas-import` et stockés dans `aliments.json`.
#
# Champs :
#   nom                 Libellé affiché.
#   ciqual              Code CIQUAL (ANSES) : nutrition + lien Agribalyse (CO2).
#   ciqual_agribalyse   Code CIQUAL « proche » à utiliser pour le CO2 quand
#                       Agribalyse ne connaît pas le code exact.
#   famille             Sert aux repères PNNS (voir docs/algorithme.md) :
#                       feculent, feculent-complet, legumineuse, legume, fruit,
#                       viande-rouge, volaille, charcuterie, poisson,
#                       poisson-gras, fruits-de-mer, oeuf, laitier, fromage,
#                       matiere-grasse, sucre, condiment.
#   rayon               Regroupement sur la liste de courses.
#   saison              Identifiant du calendrier Impact CO2 (ADEME). Absent =
#                       disponible toute l'année (conserve, surgelé, sec...).
#                       Les légumes de garde (carotte, oignon, ail, échalote),
#                       conservés en France toute l'année, et le citron (utilisé
#                       en petite quantité) n'ont volontairement pas de saison.
#   conservation_jours  Durée de conservation après achat. Si >= 7 jours, le
#                       surplus d'un paquet entamé va dans le placard.
#   vente               Comment l'ingrédient s'achète :
#                         {mode: paquet, formats: [g...]}  formats facultatifs :
#                             si absents, déduits d'Open Food Facts (`categorie_off`).
#                         {mode: piece, poids: g, lots: [n...]}
#                         {mode: vrac, pas: g}
#   unite               "g" (défaut) ou "ml" (liquides, densité ~1).
#   part_comestible     Fraction comestible (épluchures, noyaux...), défaut 1.
#   basique             true = produit de fond de placard (sel, épices, huile) :
#                       non ajouté aux courses, listé dans « à vérifier ».
#   categorie_off       Catégorie Open Food Facts (conditionnements et prix).
#   prix_kg             Prix de repli en €/kg si Open Prices n'a pas assez de
#                       relevés.
# =============================================================================

