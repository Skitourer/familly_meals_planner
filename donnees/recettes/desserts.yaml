# --- Desserts plaisir (jokers uniquement) --------------------------------------
- id: mousse-chocolat
  nom: Mousse au chocolat
  type: dessert
  plaisir: true
  temps: {preparation: 20, cuisson: 0}
  ingredients: {chocolat-noir: 35, oeuf: 50, sucre: 5}
  etapes:
    - Faire fondre le chocolat, ajouter les jaunes.
    - Incorporer les blancs montés en neige avec le sucre ; réserver 3 h au frais.

- id: crepes-sucre
  nom: Crêpes au sucre
  type: dessert
  plaisir: true
  temps: {preparation: 10, cuisson: 15}
  ingredients: {farine: 40, oeuf: 25, lait: 70, sucre: 10, beurre: 5}
  etapes:
    - Préparer la pâte, laisser reposer 30 min, cuire les crêpes.

- id: gateau-yaourt
  nom: Gâteau au yaourt
  type: dessert
  plaisir: true
  temps: {preparation: 10, cuisson: 35}
  ingredients: {farine: 35, yaourt: 20, sucre: 20, oeuf: 20, huile-colza: 8, levure-chimique: 1}
  etapes:
    - Mélanger yaourt, sucre, œufs, huile puis farine et levure.
    - Cuire 35 min à 180 °C.

- id: tarte-pommes
  nom: Tarte aux pommes
  type: dessert
  plaisir: true
  temps: {preparation: 15, cuisson: 35}
  ingredients: {pate-brisee: 40, pomme: 120, sucre: 8, beurre: 3}
  etapes:
    - Foncer le moule, disposer les pommes en lamelles, saupoudrer de sucre.
    - Cuire 35 min à 190 °C.
