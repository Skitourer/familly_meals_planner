# Mises à jour automatiques des dépendances, regroupées pour limiter le bruit.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: monthly }
    groups:
      python: { patterns: ["*"] }
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups:
      interface: { patterns: ["*"] }
    ignore:
      # TypeScript 7 n'est pas encore supporté par svelte-check : mises à jour majeures à la main.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci" }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(docker)" }
